<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#071018"/>
<title>CarDroid Smart — تحكم</title>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
:root{color-scheme:dark;--bg:#071018;--card:#10202b;--line:#1c3342;--teal:#1ec9c0;--text:#e8f4f2;--muted:#8aa3ad;--red:#e11d2e;--ok:#3dd68c;--warn:#e8c15a}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#123043,var(--bg) 55%);color:var(--text);min-height:100dvh}
main{max-width:460px;margin:0 auto;padding:18px 16px 32px}
h1{margin:0;text-align:center;letter-spacing:.3px;font-size:26px;font-weight:700}
h1 span{color:var(--teal)}
.status{margin:14px auto 18px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px;background:var(--red);box-shadow:0 0 0 2px #0003}
.dot.on{background:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:16px;padding:16px 10px;color:#fff;background:#143240;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.primary{background:var(--teal);color:#042226}
button.warn{background:#3a1c24;color:#ffd0d6}
button.ok{background:#1a3a2a;color:var(--ok)}
.wide{grid-column:1/-1}
.info{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--muted)}
.info b{color:var(--text)}
#msg{color:var(--teal);text-align:center;min-height:1.4em;margin:10px 0 0;font-size:13px}
.loc{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>Car<span>Droid</span> Smart</h1>
  <div class="status">
    <div><span id="dot" class="dot"></span><b id="link">غير متصل</b></div>
    <div id="wifi">الواي فاي: —</div>
  </div>
  <div class="grid">
    <button class="primary" onclick="cmd('lock',1)">إغلاق الأبواب</button>
    <button onclick="cmd('unlock',1)">فتح الأبواب</button>
    <button onclick="cmd('horn',true)">الكلاكس</button>
    <button onclick="cmd('lights',true)">الإضاءة</button>
    <button onclick="cmd('bag',true)">الشنطة</button>
    <button onclick="cmd('map',true)">الخريطة</button>
    <button class="warn wide" onclick="engineOff()">إغلاق المحرك</button>
    <button class="ok wide" onclick="engineOn()">تشغيل المحرك</button>
  </div>
  <div id="msg"></div>
  <div class="info">
    <div><b>الموقع:</b> <span id="loc" class="loc">—</span></div>
    <div><b>القفل:</b> <span id="lockv">—</span> · <b>الأمان:</b> <span id="secv">—</span> · <b>المحرك:</b> <span id="marshv">—</span></div>
    <div><b>درجة الحرارة:</b> <span id="tempv">—</span> · <b>الأبواب:</b> <span id="doorsv">—</span></div>
    <div style="margin-top:8px;font-size:12px">مربوط بـ cardroid-319 / الوحدة 319<br>الأساس: V13plus · الحالة تعتمد على نبضة الوحدة</div>
  </div>
</main>
<script>
const base = "https://cardroid-319-default-rtdb.firebaseio.com";
let lastH = {};

async function read() {
  try {
    const res = await fetch(base + "/h.json");
    if (!res.ok) throw new Error(res.status);
    const h = await res.json() || {};
    lastH = h;
    const fresh = Number(h.onlineAt) > 0 && Date.now() - Number(h.onlineAt) < 20000;
    const on = h.connect === true && h.wificonnected === true && fresh;
    document.getElementById("dot").className = "dot" + (on ? " on" : "");
    document.getElementById("link").textContent = on ? "متصل" : "السيارة غير متصلة بالانترنت";
    document.getElementById("wifi").textContent = "الواي فاي: " + (h.wificonnected ? (h.wifiName || "متصل") : "غير متصل");
    document.getElementById("loc").textContent = h.location || "—";
    document.getElementById("lockv").textContent = h.lock == 1 ? "مغلق" : (h.lock == 0 ? "مفتوح" : h.lock);
    document.getElementById("secv").textContent = h.security == 1 ? "مفعل" : "غير مفعل";
    document.getElementById("marshv").textContent = h.marsh == 1 ? "شغال" : "واقف";
    document.getElementById("tempv").textContent = h.temp || "—";
    document.getElementById("doorsv").textContent = h.cardoorsopen ? "مفتوحة" : "مغلقة";
  } catch (e) {
    document.getElementById("msg").textContent = "خطأ في القراءة";
  }
}

async function cmd(key, v) {
  const t = Date.now();
  const body = {
    ["h/" + key]: v,
    ["319/" + key]: v,
    ["319/h/h_" + key]: { cmd: "h/" + key, t, v }
  };
  try {
    const res = await fetch(base + "/.json", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      document.getElementById("msg").textContent = "أُرسل " + key;
    } else {
      document.getElementById("msg").textContent = "فشل الإرسال";
    }
  } catch (e) {
    document.getElementById("msg").textContent = "خطأ شبكة";
  }
  setTimeout(read, 400);
}

async function engineOff() {
  const t = Date.now();
  const body = {
    "h/drive": 0, "h/marsh": 0, "h/security": 1,
    "319/drive": 0, "319/marsh": 0, "319/security": 1,
    "319/h/h_drive": { cmd:"h/drive", t, v:0 },
    "319/h/h_marsh": { cmd:"h/marsh", t, v:0 },
    "319/h/h_security": { cmd:"h/security", t, v:1 }
  };
  try {
    await fetch(base + "/.json", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    document.getElementById("msg").textContent = "أُرسل إغلاق المحرك";
  } catch (e) {
    document.getElementById("msg").textContent = "خطأ";
  }
  setTimeout(read, 500);
}

async function engineOn() {
  const t = Date.now();
  const body = {
    "h/marsh": 1, "h/security": 0, "h/drive": 1,
    "319/marsh": 1, "319/security": 0, "319/drive": 1,
    "319/h/h_marsh": { cmd:"h/marsh", t, v:1 },
    "319/h/h_security": { cmd:"h/security", t, v:0 },
    "319/h/h_drive": { cmd:"h/drive", t, v:1 }
  };
  try {
    await fetch(base + "/.json", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    document.getElementById("msg").textContent = "أُرسل تشغيل المحرك";
  } catch (e) {
    document.getElementById("msg").textContent = "خطأ";
  }
  setTimeout(read, 500);
}

read();
setInterval(read, 2500);
</script>
</body>
</html>
