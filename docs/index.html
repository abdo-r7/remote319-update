<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CarDroid Web</title>
<style>
:root{color-scheme:dark;--bg:#07131b;--card:#102433;--line:#1c4256;--teal:#1ec9c0;--text:#f7fbfb;--muted:#8eacb8;--ok:#3dd68c;--red:#ff5d6c}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:radial-gradient(circle at 50% -10%,#164257,var(--bg) 46%);color:var(--text)}
main{max-width:460px;margin:0 auto;padding:18px}
h1{margin:0 0 6px;font-size:24px}h1 span{color:var(--teal)}.sub,.k{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
input,button{width:100%;border:0;border-radius:14px;font:inherit}
input{margin:8px 0;padding:12px;background:#0c1821;color:#fff}
button{min-height:52px;margin-top:8px;background:#163246;color:#fff;font-weight:700}
button.primary{background:var(--teal);color:#042226}button.warn{background:#3c1d26;color:#ffd5db}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}
.stat{background:#0c1821;border-radius:14px;padding:12px}.stat b{display:block;margin-top:6px;font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--red)}.dot.on{background:var(--ok)}
img.qr{width:220px;height:220px;background:#fff;border-radius:12px;padding:8px}
#msg{color:var(--muted);text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Car<span>Droid</span></h1>
<p class="sub">موقع التحكم · الوحدة 319</p>
<section id="login" class="card">
<b>تسجيل الدخول</b>
<input id="user" placeholder="اسم المستخدم" autocomplete="username"/>
<input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password"/>
<button class="primary" onclick="login()">دخول</button>
<p id="loginmsg" class="k"></p>
</section>
<section id="app" class="hidden">
<section class="card">
<div><b id="link">بانتظار القراءة</b> <i id="dot" class="dot"></i></div>
<div class="grid" style="margin-top:12px">
<div class="stat"><span class="k">الباب</span><b id="door">—</b></div>
<div class="stat"><span class="k">المحرك</span><b id="engine">—</b></div>
<div class="stat"><span class="k">التأمين</span><b id="sec">—</b></div>
<div class="stat"><span class="k">الواي فاي</span><b id="wifi">—</b></div>
</div>
</section>
<div class="grid">
<button class="primary" onclick="cmd('lock',1,'قفل')">إغلاق</button>
<button onclick="cmd('unlock',1,'فتح')">فتح</button>
<button onclick="cmd('horn',true,'كلاكس')">الكلاكس</button>
<button onclick="cmd('lights',1,'إضاءة')">الإضاءة</button>
<button class="primary wide" onclick="engineOn()">تشغيل المحرك</button>
<button class="warn wide" onclick="engineOff()">إغلاق المحرك</button>
<button onclick="secure(1)">تأمين</button>
<button onclick="secure(0)">إيقاف التأمين</button>
<button class="wide" onclick="openMap()">الخريطة</button>
</div>

</section>

<button class="warn" onclick="logout()">خروج</button>
</section>
</main>
<script>
const base="https://cardroid-319-default-rtdb.firebaseio.com";
const USER="abdo", PASS="cardroid319";
let point="";
function login(){
  if(document.getElementById("user").value===USER && document.getElementById("pass").value===PASS){
    sessionStorage.ok="1"; showApp();
  } else document.getElementById("loginmsg").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
}
function logout(){sessionStorage.removeItem("ok"); location.reload()}
function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");read()}
function paint(h){
  const on=h.wificonnected===true;
  document.getElementById("dot").className="dot"+(on?" on":"");
  document.getElementById("link").textContent=on?"متصل بالواي فاي":"غير متصل";
  document.getElementById("door").textContent=h.lock==1?"مقفول":"غير مكتوب";
  document.getElementById("engine").textContent=h.drive==1?"شغال":"موقوف";
  document.getElementById("sec").textContent=h.security==1?"مؤمّن":"غير مؤمّن";
  document.getElementById("wifi").textContent=on?(h.wifiName||"متصل"):"غير متصل";
  point=String(h.location||"");
}
async function read(){
  try{const h=await(await fetch(base+"/h.json")).json()||{};paint(h)}
  catch(e){document.getElementById("msg").textContent=String(e).slice(0,90)}
}
async function send(body,label){
  document.getElementById("msg").textContent="جارٍ إرسال "+label;
  await fetch(base+"/.json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  document.getElementById("msg").textContent="أُرسل "+label; read();
}
function cmd(key,v,label){
  const body={["h/"+key]:v,["319/"+key]:v,["319/h/h_"+key]:{cmd:"h/"+key,t:Date.now(),v}};
  if(key==="lock")body["h/lock"]=1; if(key==="unlock")body["h/lock"]=0;
  return send(body,label);
}
function engineOn(){const t=Date.now();return send({"h/drive":1,"h/marsh":0,"h/security":0,"319/h/h_drive":{cmd:"h/drive",t,v:1}},"تشغيل")}
function engineOff(){const t=Date.now();return send({"h/drive":0,"h/marsh":0,"h/security":1,"319/h/h_drive":{cmd:"h/drive",t,v:0}},"إغلاق")}
function secure(v){const t=Date.now();return send({"h/security":v,"319/security":v,"319/h/h_security":{cmd:"h/security",t,v}},v?"تأمين":"إيقاف التأمين")}
function openMap(){if(!point.includes(",")){document.getElementById("msg").textContent="لا توجد إحداثيات";return} location.href="https://www.google.com/maps?q="+encodeURIComponent(point)}
if(sessionStorage.ok==="1")showApp(); else setInterval(()=>{},1);
setInterval(()=>{if(sessionStorage.ok==="1")read()},2000);
</script>
</body>
