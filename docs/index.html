<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CarDroid Web</title>
<style>
:root{color-scheme:dark;--bg:#07131b;--card:#102433;--line:#1c4256;--teal:#1ec9c0;--text:#f7fbfb;--muted:#8eacb8;--ok:#3dd68c;--warn:#e8c15a;--red:#ff5d6c}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:radial-gradient(circle at 50% -10%,#164257,var(--bg) 46%);color:var(--text)}
main{max-width:460px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{margin:0;font-size:24px}h1 span{color:var(--teal)}.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
button{border:0;font:inherit;color:#fff;background:#163246;font-weight:700;border-radius:16px}
button:active{transform:scale(.98)}
.icon{width:42px;height:42px;border-radius:14px;background:#123846;color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.pill{display:flex;justify-content:space-between;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}.dot.live{background:var(--ok)}.dot.wifi{background:var(--warn)}
.state{font-size:18px}.age,.k{color:var(--muted);font-size:12px}
.stats,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0c1821;border-radius:14px;padding:12px}
.stat b{display:block;margin-top:6px;font-size:18px}
.cmd{min-height:56px}.primary{background:var(--teal);color:#042226}.warn{background:#3c1d26;color:#ffd5db}.wide{grid-column:1/-1}
#msg{color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
<header>
<div><h1>Car<span>Droid</span></h1><p class="sub">ويب · الجهاز 319</p></div>
<button class="icon" onclick="read(true)">↻</button>
</header>
<section class="card">
<div class="pill"><div><b id="link" class="state">بانتظار القراءة</b><div id="age" class="age">النبضة —</div></div><i id="dot" class="dot"></i></div>
<div class="stats" style="margin-top:12px">
<div class="stat"><span class="k">الباب</span><b id="door">—</b></div>
<div class="stat"><span class="k">المحرك</span><b id="engine">—</b></div>
<div class="stat"><span class="k">التأمين</span><b id="sec">—</b></div>
<div class="stat"><span class="k">الكلاكس</span><b id="horn">—</b></div>
<div class="stat"><span class="k">الواي فاي</span><b id="wifi">—</b></div>
<div class="stat"><span class="k">الموقع</span><b id="loc">—</b></div>
</div>
</section>
<div class="grid">
<button class="cmd primary" onclick="cmd('lock',1,'قفل')">إغلاق</button>
<button class="cmd" onclick="cmd('unlock',1,'فتح')">فتح</button>
<button class="cmd" onclick="cmd('horn',true,'كلاكس')">الكلاكس</button>
<button class="cmd" onclick="cmd('horn',false,'إيقاف')">إيقاف الكلاكس</button>
<button class="cmd" onclick="cmd('lights',1,'إضاءة')">الإضاءة</button>
<button class="cmd" onclick="cmd('bag',1,'شنطة')">الشنطة</button>
<button class="cmd primary wide" onclick="engineOn()">تشغيل المحرك</button>
<button class="cmd warn wide" onclick="engineOff()">إغلاق المحرك</button>
<button class="cmd" onclick="secure(1)">تأمين</button>
<button class="cmd" onclick="secure(0)">إيقاف التأمين</button>
<button class="cmd wide" onclick="openMap()">الخريطة</button>
</div>
<p id="msg"></p>
</main>
<script>
const base="https://cardroid-319-default-rtdb.firebaseio.com";
let point="";
function paint(h,ms){
  const age=Number(h.onlineAt)>0?Date.now()-Number(h.onlineAt):null;
  const live=age!=null&&age<15000;
  const wifi=h.wificonnected===true;
  document.getElementById("dot").className="dot"+(live?" live":wifi?" wifi":"");
  document.getElementById("link").textContent=live?"متصل ونبضة حية":wifi?"واي فاي بلا نبضة":"منقطع";
  document.getElementById("age").textContent=age==null?"النبضة لا ترسلها الوحدة":"آخر نبضة "+Math.max(0,Math.round(age/1000))+" ث";
  document.getElementById("door").textContent=h.lock==1?"مقفول":"غير مكتوب";
  document.getElementById("engine").textContent=h.drive==1?"شغال":"موقوف";
  document.getElementById("sec").textContent=h.security==1?"مؤمّن":"غير مؤمّن";
  document.getElementById("horn").textContent=h.horn===true?"يعمل":"متوقف";
  document.getElementById("wifi").textContent=wifi?(h.wifiName||"متصل"):"غير متصل";
  const fresh=h.locationsource==="gps"&&Number(h.locationAt)>0&&Date.now()-Number(h.locationAt)<120000;
  point=fresh?String(h.location||""):(h.location?String(h.location):"");
  document.getElementById("loc").textContent=h.location?(fresh?"تثبيت حديث":"تقريبي"):"لا يوجد";
  if(ms!=null)document.getElementById("msg").textContent="قراءة "+Math.round(ms)+" ms";
}
async function read(manual){
  const t0=performance.now();
  try{const h=await(await fetch(base+"/h.json")).json()||{};paint(h,manual?performance.now()-t0:null)}
  catch(e){document.getElementById("link").textContent="تعذر القراءة";document.getElementById("msg").textContent=String(e).slice(0,90)}
}
async function send(body,label){
  const t=Date.now();
  document.getElementById("msg").textContent="جارٍ إرسال "+label;
  await fetch(base+"/.json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  document.getElementById("msg").textContent="أُرسل "+label+" في "+(Date.now()-t)+" ms";
  read();
}
function cmd(key,v,label){
  if(key==="unlock"&&document.getElementById("sec").textContent==="مؤمّن"){document.getElementById("msg").textContent="أوقف التأمين قبل الفتح";return}
  const body={["h/"+key]:v,["319/"+key]:v,["319/h/h_"+key]:{cmd:"h/"+key,t:Date.now(),v}};
  if(key==="lock")body["h/lock"]=1;
  if(key==="unlock")body["h/lock"]=0;
  return send(body,label);
}
function engineOn(){const t=Date.now();return send({"h/drive":1,"h/marsh":0,"h/security":0,"319/h/h_drive":{cmd:"h/drive",t,v:1},"319/h/h_security":{cmd:"h/security",t,v:0}},"تشغيل المحرك")}
function engineOff(){const t=Date.now();return send({"h/drive":0,"h/marsh":0,"h/security":1,"319/h/h_drive":{cmd:"h/drive",t,v:0},"319/h/h_security":{cmd:"h/security",t,v:1}},"إغلاق المحرك")}
function secure(v){const t=Date.now();return send({"h/security":v,"319/security":v,"319/h/h_security":{cmd:"h/security",t,v}},v?"تأمين":"إيقاف التأمين")}
function openMap(){if(!point.includes(",")){document.getElementById("msg").textContent="لا توجد إحداثيات";return}location.href="https://www.google.com/maps?q="+encodeURIComponent(point)}
read(true);setInterval(read,2000);
</script>
</body>
</html>
